function_id = "numpy:generic.to_device"
module_name = "numpy"
function_name = "to_device"
provider = "c_extension"
mapping_status = "success"
parameter_inference_status = "success"
return_inference_status = "success"
class_name = "generic"
source_location = "<SourceLocation file '../numpy/_core/src/multiarray/array_api_standard.c', line 14, column 1>"
source_text = """
NPY_NO_EXPORT PyObject *
array_to_device(PyObject *self, PyObject *args, PyObject *kwds)
{
    static char *kwlist[] = {"", "stream", NULL};
    char *device = "";
    PyObject *stream = Py_None;

    if (!PyArg_ParseTupleAndKeywords(args, kwds, "s|$O:to_device", kwlist,
                                     &device,
                                     &stream)) {
        return NULL;
    }

    if (stream != Py_None) {
        PyErr_SetString(PyExc_ValueError,
                        "The stream argument in to_device() "
                        "is not supported");
        return NULL;
    }

    if (strcmp(device, "cpu") != 0) {
        PyErr_Format(PyExc_ValueError,
                     "Unsupported device: %s. Only 'cpu' is accepted.", device);
        return NULL;
    }

    Py_INCREF(self);
    return self;
}"""

[[functions.signatures]]
signature_index = 0
signature = """
def to_device(
    self,
    device: str,
    /,
    *,
    stream: object = None,
) -> typing.Self:"""

