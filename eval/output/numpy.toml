        /* Otherwise assume it's a Python TZInfo, or acts like one */
        else {
            local = 1;
        }
    }

    /* Get a string size long enough for any datetimes we're given */
    strsize = NpyDatetime_GetDatetimeISO8601StrLen(local, unit);
