static PyObject *
_merge(PyObject *self, PyObject *args) {
    char *mode_name;
    ImagingObject *band0 = NULL;
    ImagingObject *band1 = NULL;
    ImagingObject *band2 = NULL;
    ImagingObject *band3 = NULL;
    Imaging bands[4] = {NULL, NULL, NULL, NULL};

    if (!PyArg_ParseTuple(
            args,
            "sO!|O!O!O!",
            &mode_name,
            &Imaging_Type,
            &band0,
            &Imaging_Type,
            &band1,
            &Imaging_Type,
            &band2,
            &Imaging_Type,
            &band3
        )) {
        return NULL;
    }

    const ModeID mode = findModeID(mode_name);

    if (band0) {
        bands[0] = band0->image;
    }
    if (band1) {
        bands[1] = band1->image;
    }
    if (band2) {
        bands[2] = band2->image;
    }
    if (band3) {
        bands[3] = band3->image;
    }

    Imaging imOut = ImagingMerge(mode, bands);
    if (!imOut) {
        return NULL;
    }
    ImagingCopyPalette(imOut, bands[0]);
    return PyImagingNew(imOut);
}"""

