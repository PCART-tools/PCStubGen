\tPyArg_ParseTupleAndKeywords(args, keywds, "iiO!O!O!O|Oi", kwlist,
\t\t\t\t    &N, &nnz,
\t\t\t\t    &PyArray_Type, &nzvals,
\t\t\t\t    &PyArray_Type, &rowind,
\t\t\t\t    &PyArray_Type, &colptr,
                                    &py_csc_construct_func,
\t\t\t\t    &option_dict,
\t\t\t\t    &ilu);

    if (!res)
\treturn NULL;

    if (!_CHECK_INTEGER(colptr) || !_CHECK_INTEGER(rowind)) {
\tPyErr_SetString(PyExc_TypeError,
\t\t\t"rowind and colptr must be of type cint");
\treturn NULL;
