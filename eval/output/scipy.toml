    if (!PyArg_ParseTuple(args, ("O!i"), &PyArray_Type, (PyObject **)&ap_Am, &m)) return NULL;
    if (!(PyArray_IS_C_CONTIGUOUS(ap_Am)) ||
        ((PyArray_TYPE(ap_Am) != NPY_FLOAT64) &&
