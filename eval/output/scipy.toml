\t\t\t\t     &N, &nnz, &PyArray_Type, &nzvals,
\t\t\t\t     &PyArray_Type, &colind, &PyArray_Type,
\t\t\t\t     &rowptr, &Py_B, &csc, &option_dict)) {
\treturn NULL;
