source_location = "<SourceLocation file '../scipy/interpolate/src/_dierckxmodule.cc', line 1030, column 1>"
source_text = """
static PyObject*
py_evaluate_all_bspl(PyObject* self, PyObject* args)
{
    PyObject *py_t = NULL;
    int k, m;
    int nu = 0;
    double xval;

    if(!PyArg_ParseTuple(args, "Oidi|i", &py_t, &k, &xval, &m, &nu)) {
        return NULL;
    }
    if (!check_array(py_t, 1, NPY_DOUBLE)) {
        return NULL;
    }
    PyArrayObject *a_t = (PyArrayObject *)py_t;

    // allocate temp storage
    std::vector<double> wrk(2*k + 2);

    /*
     * If nu > k+1, the B-spline derivative is identically zero.
     * Avoid the de Boor recursion (which assumes m <= k+1) and
     * return a zero-filled result directly.
     */
    if( nu > k + 1 ) {
        for( size_t i = 0; i < wrk.size(); i++ ) {
            wrk[i] = 0.0;
        }
    } else {
        // compute non-zero bsplines
        fitpack::_deBoor_D(
            static_cast<const double*>(PyArray_DATA(a_t)),
            xval,
            k,
            m,
            nu,
            wrk.data()
        );
    }

    // allocate and fill the output
    npy_intp dims[1] = {k+1};
    PyArrayObject *arr = (PyArrayObject *)PyArray_SimpleNew(1, dims, NPY_DOUBLE);
    if (arr == NULL) {
        PyErr_NoMemory();
        return NULL;
    }

    memcpy(PyArray_DATA(arr), wrk.data(), (k+1)*sizeof(double));
    return (PyObject *)arr;
}"""

