[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcstubgen"
version = "0.1.0"
description = "Generate Python stubs for modules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libclang>=18.1.1",
    "loguru>=0.7.3",
    "typer>=0.24.1",
]

[project.scripts]
pcstubgen = "pcstubgen.__main__:app"

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "mypy>=1.20.0",
    "numpy>=2.4.4",
    "pybind11-stubgen>=2.5.5",
    "pytest>=9.0.2",
    "requests>=2.33.1",
    "scipy>=1.17.1",
]
