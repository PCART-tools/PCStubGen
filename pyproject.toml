[build-system]
requires = [
    "meson-python>=0.19.0",
    "ninja>=1.13.0",
]
build-backend = "mesonpy"

[project]
name = "pcstubgen"
dynamic = ["version"]
description = "Generate Python stubs for C extension APIs."
readme = "README.md"
authors = [
    { name = "PCART-tools" },
    { name = "HoMiyabi" },
]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
keywords = [
    "c-extension",
    "libclang",
    "pybind11",
    "stub",
    "stubgen",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "build>=1.4.4",
    "libclang>=18.1.1",
    "loguru>=0.7.3",
    "toml-rs>=0.3.12",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/PCART-tools/PCStubGen"
Repository = "https://github.com/PCART-tools/PCStubGen"
Issues = "https://github.com/PCART-tools/PCStubGen/issues"

[project.scripts]
pcstubgen = "pcstubgen.__main__:app"

[dependency-groups]
build = [
    "meson-python>=0.19.0",
    "ninja>=1.13.0",
]
test = [
    "pytest>=9.0.3",
]
eval = [
    "json-repair>=0.59.5",
    "matplotlib>=3.10.9",
    "openai>=2.33.0",
    "rich>=13.8.0",
]
tools = [
    "requests>=2.33.1",
]
dev = [
    { include-group = "build" },
    { include-group = "test" },
    { include-group = "eval" },
    { include-group = "tools" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference", ".git", ".idea", ".mypy_cache", ".pytest_cache", "out"]
addopts = ["--strict-markers"]
markers = [
    "integration: 覆盖跨模块协作或薄集成行为的测试。",
    "libclang: 依赖 libclang 实际解析能力的测试。",
    "slow: 相对较慢或需要真实外部能力的测试。",
]
